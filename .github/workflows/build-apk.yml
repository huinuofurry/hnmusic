name: build-apk

on:
  push:
    branches: [ main, master ]
    paths: [ 'app/android/**', '.github/workflows/build-apk.yml' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore signing keystore
        run: |
          if [ -n "${{ secrets.HN_KS_BASE64 }}" ]; then
            echo "${{ secrets.HN_KS_BASE64 }}" | base64 -d > app/hnmusic.jks
            echo "用 secrets 里的 keystore 签名（能覆盖安装旧版）"
          else
            echo "没配 secrets.HN_KS_BASE64 ⇒ 走 debug 签名"
          fi

      - name: Build APK
        run: |
          if [ -f app/hnmusic.jks ]; then
            gradle --no-daemon assembleRelease
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Collect APK
        run: |
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -lh out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hnmusic-apk
          path: app/android/out/*.apk
          if-no-files-found: error
